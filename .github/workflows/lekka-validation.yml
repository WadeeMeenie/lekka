name: Lekka validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 supports Node 20.19.x+, while the current Supabase JS
      # release requires Node >=22. Use Node 22 to satisfy both toolchains.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm caching is intentionally disabled because this repo has no lockfile.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      # Full Expo introspection exits silently for this project in CI because
      # the custom Android config plugin expects a generated native project.
      # Validate the dynamic config directly here; native builds exercise the
      # plugin after prebuild has created the Android project.
      - name: Expo config
        run: |
          node --input-type=module - <<'EOF'
          const module = await import('./app.config.ts');
          const config = module.default;
          if (!config || config.name !== 'Lekka' || config.slug !== 'lekka') {
            throw new Error('Invalid Lekka Expo config');
          }
          if (config.android?.package !== 'com.app.localradarsa') {
            throw new Error('Unexpected Android package in Expo config');
          }
          console.log('Expo config OK:', config.name, config.slug, config.version);
          EOF

      - name: Expo dependency compatibility
        run: npx expo install --check
