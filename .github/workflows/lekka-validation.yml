name: Lekka validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Expo config
        run: npx expo config --type public

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor

      - name: Expo prebuild
        env:
          NODE_ENV: production
        run: npx expo prebuild --no-install --non-interactive --clean

      - name: Verify native configuration
        working-directory: android
        run: |
          grep -q '^newArchEnabled=true' gradle.properties
          grep -q 'compileSdkVersion' app/build.gradle || true
          ./gradlew :app:tasks --all --no-daemon >/tmp/gradle-tasks.txt
          grep -q 'assembleDebug' /tmp/gradle-tasks.txt
          grep -q 'assembleInternalDebug' /tmp/gradle-tasks.txt

      - name: Android debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Android internal debug build
        working-directory: android
        run: ./gradlew :app:assembleInternalDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: lekka-android-debug-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/internalDebug/*.apk
          if-no-files-found: error

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lekka-gradle-reports
          path: |
            android/**/build/reports/**
            android/**/build/outputs/logs/**
          if-no-files-found: ignore
