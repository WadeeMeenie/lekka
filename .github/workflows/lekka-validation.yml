name: Lekka validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 requires Node >=20.19.x. Keep CI on the supported LTS
      # runtime and use npm here because the repository does not contain a
      # pnpm lockfile; npm is also the package manager used for local validation.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo config
        run: npx expo config --json --full > /tmp/expo-config.json

      - name: Expo Doctor
        run: npx expo-doctor
