name: Lekka validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 supports Node 20.19.x+, while the current Supabase JS
      # release requires Node >=22. Use Node 22 to satisfy both toolchains.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm caching is intentionally disabled because this repo has no lockfile.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo config
        run: npx expo config --type public

      - name: Expo dependency compatibility
        run: npx expo install --check
