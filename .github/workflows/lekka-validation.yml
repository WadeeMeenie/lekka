name: Lekka validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Expo SDK 54 requires Node >=20.19.x. Use the supported Node 20
      # runtime for project validation. Do not enable setup-node npm caching:
      # this repository intentionally has no lockfile, so setup-node's cache
      # precondition would fail before validation starts.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo config
        run: npx expo config --json --full > /tmp/expo-config.json

      - name: Expo Doctor
        run: npx expo-doctor
