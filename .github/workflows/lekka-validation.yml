name: Lekka validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lekka-validation-${{ github.ref }}
  cancel-in-progress: true

# CI must never silently build an APK connected to production. Configure the
# three LEKKA_STAGING_* repository secrets only after an isolated staging
# project has been approved and verified. Otherwise leave the backend unconfigured.
env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.LEKKA_STAGING_SUPABASE_URL || '' }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LEKKA_STAGING_SUPABASE_PUBLISHABLE_KEY || '' }}
  EXPO_PUBLIC_STAGING_PROJECT_REF: ${{ secrets.LEKKA_STAGING_PROJECT_REF }}
  EXPO_PUBLIC_APP_ENV: ${{ secrets.LEKKA_STAGING_PROJECT_REF != '' && 'staging' || 'ci' }}

jobs:
  code-quality:
    name: Code / tests / integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate isolated backend configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EXPO_PUBLIC_SUPABASE_URL" && -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            test -z "$EXPO_PUBLIC_STAGING_PROJECT_REF"
            test "$EXPO_PUBLIC_APP_ENV" = "ci"
          else
            test -n "$EXPO_PUBLIC_STAGING_PROJECT_REF"
            [[ "$EXPO_PUBLIC_STAGING_PROJECT_REF" =~ ^[a-z]{20}$ ]]
            test "$EXPO_PUBLIC_STAGING_PROJECT_REF" != "vnitwsjidlurlwlpsmtf"
            test "$EXPO_PUBLIC_SUPABASE_URL" = "https://${EXPO_PUBLIC_STAGING_PROJECT_REF}.supabase.co"
            test "$EXPO_PUBLIC_APP_ENV" = "staging"
            [[ "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* || "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == eyJ* ]]
          fi
      - name: Validate profile access migration on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres -v "$GITHUB_WORKSPACE:/repo:ro" postgres:17 bash -lc '
            set -euo pipefail
            until pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f /repo/tests/sql/profile-access-fixture.sql
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f /repo/supabase/migrations/20261014123000_restore_safe_profile_column_access.sql
            psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f /repo/tests/sql/profile-access-assertions.sql
          '
      - name: Install dependencies
        run: npx --yes pnpm@9.12.0 install --frozen-lockfile
      - name: TypeScript
        run: npm run check
      - name: Static interaction and route audit
        run: npm run audit:interactions
      - name: Production architecture and release invariant audit
        run: npm run audit:production
      - name: Unit and integration tests
        run: npm test
      - name: Lint
        run: npx --yes pnpm@9.12.0 run lint
      - name: Production web export
        run: npx expo export --platform web
      - name: Expo config
        run: npx expo config --type public
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Expo doctor
        run: npx expo-doctor

  android:
    name: Android native build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate isolated backend configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EXPO_PUBLIC_SUPABASE_URL" && -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]]; then
            test -z "$EXPO_PUBLIC_STAGING_PROJECT_REF"
            test "$EXPO_PUBLIC_APP_ENV" = "ci"
          else
            test -n "$EXPO_PUBLIC_STAGING_PROJECT_REF"
            [[ "$EXPO_PUBLIC_STAGING_PROJECT_REF" =~ ^[a-z]{20}$ ]]
            test "$EXPO_PUBLIC_STAGING_PROJECT_REF" != "vnitwsjidlurlwlpsmtf"
            test "$EXPO_PUBLIC_SUPABASE_URL" = "https://${EXPO_PUBLIC_STAGING_PROJECT_REF}.supabase.co"
            test "$EXPO_PUBLIC_APP_ENV" = "staging"
            [[ "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* || "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == eyJ* ]]
          fi
      - name: Install dependencies
        run: npx --yes pnpm@9.12.0 install --frozen-lockfile
      - name: Expo config
        run: npx expo config --type public
      - name: Expo prebuild
        env:
          NODE_ENV: production
        run: npx expo prebuild --no-install --non-interactive --clean
      - name: Verify generated native project
        working-directory: android
        run: |
          test -f gradlew
          grep -q '^newArchEnabled=true' gradle.properties
          test -f app/build.gradle
      - name: Android debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Android internal debug build
        working-directory: android
        run: ./gradlew :app:assembleInternalDebug --no-daemon --stacktrace
      - name: Upload CI debug APKs (backend disabled unless staging secrets are configured)
        uses: actions/upload-artifact@v4
        with:
          name: lekka-ci-debug-apks-no-production
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/internalDebug/*.apk
          if-no-files-found: error
      - name: Upload native reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lekka-native-build-reports
          path: |
            android/**/build/reports/**
            android/**/build/outputs/logs/**
            android/**/build/outputs/mapping/**
          if-no-files-found: ignore

  release-gate:
    name: Release gate
    if: always()
    needs: [code-quality, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation layer to pass
        run: |
          echo "code-quality=${{ needs.code-quality.result }}"
          echo "android=${{ needs.android.result }}"
          test "${{ needs.code-quality.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
