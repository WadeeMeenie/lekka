name: Verify Lekka

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm audit:production
