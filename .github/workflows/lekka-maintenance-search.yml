name: Lekka maintenance search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded Local search debounce
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(tabs)/local.tsx')
          s = p.read_text()
          old = '''  useEffect(() => { void loadDirectory(); }, [loadDirectory]);'''
          new = '''  useEffect(() => {
    const timeout = setTimeout(() => { void loadDirectory(); }, 350);
    return () => clearTimeout(timeout);
  }, [loadDirectory]);'''
          if s.count(old) != 1:
              raise SystemExit('Guard failed: expected exactly one Local load effect')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit and remove maintenance workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/local.tsx' .github/workflows/lekka-maintenance-search.yml
          git commit -m "Improve Local search interaction" || exit 0
          git rm .github/workflows/lekka-maintenance-search.yml
          git commit -m "Remove one-shot maintenance workflow"
          git push
