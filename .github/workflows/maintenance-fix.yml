name: Lekka maintenance fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-post-link:
    if: ${{ !contains(github.event.head_commit.message, '[maintenance-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix canonical deep link and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/post/[id].tsx')
          s = p.read_text()
          old = 'manus${""}://post/${id}'
          new = 'manuslocalradarsa://post/${id}'
          if old not in s:
              raise SystemExit('Expected malformed post deep link was not found; refusing to rewrite the file.')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/post/'[id].tsx'
          git rm .github/workflows/maintenance-fix.yml
          git commit -m 'Fix canonical post deep link [maintenance-fix]'
          git push
