name: Verify Lekka app
on:
  pull_request:
  push:
    branches:
      - fix/lekka-profile-privacy-save-20261030
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test -- --run
      - name: Interaction audit
        run: npm run audit:interactions
      - name: Production invariants
        run: npm run audit:production
