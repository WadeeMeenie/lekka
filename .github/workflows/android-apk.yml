name: Android APK build

on:
  push:
    branches:
      - audit/production-readiness-2026-10-11
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app.config.*'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'components/**'
      - 'assets/**'
      - 'plugins/**'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lekka-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build installable Android APK with EAS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret EXPO_TOKEN. Add an Expo access token under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Expo configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest config --platform android --profile preview

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive
