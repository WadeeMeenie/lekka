name: One-time discovery sync

on:
  push:
    paths:
      - .github/workflows/one-time-discovery-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cohesive discovery updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # One canonical radius mapping shared by Home, Radar and Local.
          replace(
              "lib/local-radar.ts",
              'export type LocalSettings = { area: string; radius: string; useLocation: boolean; approximateVisibility: boolean; selectedLocation: DeviceLocation | null };\nexport const defaultSettings:',
              'export type LocalSettings = { area: string; radius: string; useLocation: boolean; approximateVisibility: boolean; selectedLocation: DeviceLocation | null };\nexport function discoveryRadiusToMeters(radius: string): number {\n  if (radius.includes("500")) return 500;\n  if (radius.includes("1 km")) return 1000;\n  if (radius.includes("5 km")) return 5000;\n  if (radius.includes("10 km")) return 10000;\n  return 25000;\n}\nexport const defaultSettings:'
          )

          # Discovery and feed APIs use the same radius semantics.
          replace(
              "lib/discovery.ts",
              'import { loadSettings, type DiscoveryContentType, type RadarCategory } from "@/lib/local-radar";',
              'import { discoveryRadiusToMeters, loadSettings, type DiscoveryContentType, type RadarCategory } from "@/lib/local-radar";'
          )
          replace(
              "lib/discovery.ts",
              'function radiusToMeters(radius: string) {\n  if (radius.includes("500")) return 500;\n  if (radius.includes("1 km")) return 1000;\n  if (radius.includes("5 km")) return 5000;\n  if (radius.includes("10 km")) return 10000;\n  return 25000;\n}\n\n',
              ''
          )
          replace(
              "lib/discovery.ts",
              'const radiusMeters = filters.radiusMeters ?? radiusToMeters(settings.radius);',
              'const radiusMeters = filters.radiusMeters ?? discoveryRadiusToMeters(settings.radius);'
          )

          replace(
              "lib/supabase-repository.ts",
              'import { LocalPost, LocalSettings, RadarCategory, RadarItem, loadPosts, loadSettings, savePosts } from "@/lib/local-radar";',
              'import { LocalPost, LocalSettings, RadarCategory, RadarItem, discoveryRadiusToMeters, loadPosts, loadSettings, savePosts } from "@/lib/local-radar";'
          )
          replace(
              "lib/supabase-repository.ts",
              'export async function fetchFeedPage(location: DeviceLocation | undefined, cursor: string | null, pageSize = 20): Promise<FeedPage> {',
              'export async function fetchFeedPage(location: DeviceLocation | undefined, cursor: string | null, pageSize = 20, radiusMeters = 5000): Promise<FeedPage> {'
          )
          replace(
              "lib/supabase-repository.ts",
              'radius_meters: 5000, cursor_created_at: cursorCreatedAt, cursor_id: cursorId, page_size: pageSize',
              'radius_meters: radiusMeters, cursor_created_at: cursorCreatedAt, cursor_id: cursorId, page_size: pageSize'
          )

          # Home consumes the same persisted radius as Radar/Local, and its post time display is canonical.
          replace(
              "app/(tabs)/index.tsx",
              'import { FeedTab, FeedPreference, LocalPost, loadSettings, personalizeFeed } from "@/lib/local-radar";',
              'import { FeedTab, FeedPreference, LocalPost, discoveryRadiusToMeters, loadSettings, personalizeFeed } from "@/lib/local-radar";\nimport { formatPostTime } from "@/lib/post-format";'
          )
          start = 'function formatPostTime(value: string): string {'
          a = Path("app/(tabs)/index.tsx")
          text = a.read_text()
          i = text.find(start)
          if i < 0:
              raise SystemExit("Home formatPostTime block not found")
          j = text.find('\n}\n\nexport default function HomeScreen()', i)
          if j < 0:
              raise SystemExit("Home formatPostTime block end not found")
          text = text[:i] + text[j+3:]
          a.write_text(text)

          replace(
              "app/(tabs)/index.tsx",
              'const [deviceLocation, setDeviceLocation] = useState<DeviceLocation | null>(null);',
              'const [deviceLocation, setDeviceLocation] = useState<DeviceLocation | null>(null);\n  const [radiusMeters, setRadiusMeters] = useState(5000);'
          )
          replace(
              "app/(tabs)/index.tsx",
              'if (liveLocation) { setDeviceLocation(liveLocation); setArea(liveLocation.area); }\n      else setArea(settings.area || "your area");\n      const firstPage = await fetchFeedPage(liveLocation, null);',
              'setRadiusMeters(discoveryRadiusToMeters(settings.radius));\n      if (liveLocation) { setDeviceLocation(liveLocation); setArea(liveLocation.area); }\n      else setArea(settings.area || "your area");\n      const firstPage = await fetchFeedPage(liveLocation, null, 20, discoveryRadiusToMeters(settings.radius));'
          )
          replace(
              "app/(tabs)/index.tsx",
              'void fetchFeedPage(deviceLocation ?? undefined, null).then((next) => {',
              'void fetchFeedPage(deviceLocation ?? undefined, null, 20, radiusMeters).then((next) => {'
          )
          replace(
              "app/(tabs)/index.tsx",
              '}, [deviceLocation]);',
              '}, [deviceLocation, radiusMeters]);'
          )
          replace(
              "app/(tabs)/index.tsx",
              'const page = await fetchFeedPage(liveLocation, null); setPosts(page.posts);',
              'const nextRadius = discoveryRadiusToMeters(settings.radius); setRadiusMeters(nextRadius); const page = await fetchFeedPage(liveLocation, null, 20, nextRadius); setPosts(page.posts);'
          )
          replace(
              "app/(tabs)/index.tsx",
              'const page = await fetchFeedPage(deviceLocation ?? undefined, nextCursor);',
              'const page = await fetchFeedPage(deviceLocation ?? undefined, nextCursor, 20, radiusMeters);'
          )

          # Canonical app deep-link scheme; app.config derives manuslocalradarsa from the package.
          replace("app/post/[id].tsx", 'manus${""}://post/${id}', 'manuslocalradarsa://post/${id}')

          # The package already pins the Expo-compatible clipboard dependency; fail loudly if it disappears.
          package = Path("package.json").read_text()
          if '"expo-clipboard": "~8.0.7"' not in package:
              raise SystemExit("expo-clipboard dependency is missing or unexpectedly changed")
          PY

      - name: Validate changed sources
        run: |
          node --version
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm check

      - name: Commit and remove maintenance workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-discovery-sync.yml
          git add app/(tabs)/index.tsx app/post/[id].tsx lib/local-radar.ts lib/discovery.ts lib/supabase-repository.ts
          git commit -m "Unify Home feed with discovery context"
          git push
