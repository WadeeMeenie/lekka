name: Lekka completion patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[lekka-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Home interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/(tabs)/index.tsx')
          s=p.read_text()
          s=s.replace('import { fetchFeedPage, subscribeToLocalChanges } from "@/lib/supabase-repository";', 'import { createPost, fetchFeedPage, subscribeToLocalChanges } from "@/lib/supabase-repository";')
          s=s.replace('const [area, setArea] = useState("Bellville");','const [area, setArea] = useState("");')
          old='''  const share = async (post: LocalPost) => {\n    try { await Share.share({ message: `${post.title ? `${post.title}\\n` : ""}${post.body}\\n\\nShared from Lekka` }); }\n    catch { Alert.alert("Couldn't share", "Please try again."); }\n  };'''
          new='''  const share = async (post: LocalPost) => {\n    if (!isAuthenticated || !user) { setAuthGateAction("share posts"); return; }\n    Alert.alert("Share post", "How do you want to share this?", [\n      { text: "Share as a Lekka post", onPress: () => void (async () => {\n        const result = await createPost({ kind: "post", category: "general", title: "Shared post", body: `Shared from ${post.author}\\n\\n${post.body}`, area: post.area || area || "your area", visibility: "nearby" });\n        if (result.error) Alert.alert("Couldn't share on Lekka", result.error.message || "Please try again.");\n        else Alert.alert("Shared", "The post was shared to your Lekka feed.");\n      })() },\n      { text: "Share externally", onPress: () => void Share.share({ message: `${post.title ? `${post.title}\\n` : ""}${post.body}\\n\\nShared from Lekka` }) },\n      { text: "Cancel", style: "cancel" },\n    ]);\n  };'''
          if old not in s: raise SystemExit('share block not found')
          s=s.replace(old,new)
          oldmenu='''    const options = [];\n    if (isOwner) options.push({ text: "Delete post", style: "destructive" as const, onPress: onDelete });\n    options.push({ text: "Not interested", onPress: () => onFeedback("not_interested") });\n    options.push({ text: "Cancel", style: "cancel" as const });'''
          newmenu='''    const options = [];\n    if (isOwner) {\n      options.push({ text: "Edit post", onPress: () => router.push({ pathname: "/edit-post/[id]", params: { id: post.id } } as never) });\n      options.push({ text: "Delete post", style: "destructive" as const, onPress: onDelete });\n    }\n    options.push({ text: "Not interested", onPress: () => onFeedback("not_interested") });\n    options.push({ text: "Cancel", style: "cancel" as const });'''
          if oldmenu not in s: raise SystemExit('menu block not found')
          s=s.replace(oldmenu,newmenu)
          p.write_text(s)
          PY
      - name: Add edit-post screen
        run: |
          mkdir -p 'app/edit-post'
          cat > 'app/edit-post/[id].tsx' <<'EOF'
          import { useEffect, useState } from "react";
          import { router, useLocalSearchParams } from "expo-router";
          import { Alert, Pressable, ScrollView, StyleSheet, Text, TextInput, View } from "react-native";
          import { ScreenContainer } from "@/components/screen-container";
          import { useColors } from "@/hooks/use-colors";
          import { useSupabaseAuth } from "@/hooks/use-supabase-auth";
          import { supabase } from "@/lib/supabase";
          export default function EditPostScreen() {
            const colors=useColors(); const {user}=useSupabaseAuth(); const {id}=useLocalSearchParams<{id:string}>();
            const [title,setTitle]=useState(""); const [body,setBody]=useState(""); const [loading,setLoading]=useState(true); const [saving,setSaving]=useState(false);
            useEffect(()=>{let active=true; void (async()=>{if(!supabase||!user||!id)return; const {data,error}=await supabase.from("posts").select("title,body,author_id").eq("id",id).maybeSingle(); if(!active)return; if(error||!data||data.author_id!==user.id){Alert.alert("Couldn't load post",error?.message||"You can only edit your own posts.");router.back();return;} setTitle(data.title??"");setBody(data.body??"");setLoading(false);})();return()=>{active=false;};},[id,user?.id]);
            const save=async()=>{if(!supabase||!user||!id||!body.trim())return;setSaving(true);const {error}=await supabase.from("posts").update({title:title.trim()||null,body:body.trim(),updated_at:new Date().toISOString()}).eq("id",id).eq("author_id",user.id);setSaving(false);if(error){Alert.alert("Couldn't save changes",error.message);return;}router.back();};
            if(loading)return <ScreenContainer><View style={styles.center}><Text style={{color:colors.muted}}>Loading post…</Text></View></ScreenContainer>;
            return <ScreenContainer><ScrollView contentContainerStyle={styles.content}><Text style={[styles.title,{color:colors.foreground}]}>Edit post</Text><Text style={[styles.label,{color:colors.muted}]}>TITLE</Text><TextInput value={title} onChangeText={setTitle} placeholder="Title" placeholderTextColor={colors.muted} style={[styles.input,{color:colors.foreground,borderColor:colors.border,backgroundColor:colors.surface}]}/><Text style={[styles.label,{color:colors.muted}]}>POST</Text><TextInput multiline value={body} onChangeText={setBody} placeholder="What's happening?" placeholderTextColor={colors.muted} textAlignVertical="top" style={[styles.body,{color:colors.foreground,borderColor:colors.border,backgroundColor:colors.surface}]}/><Pressable disabled={saving||!body.trim()} onPress={()=>void save()} style={[styles.button,{backgroundColor:colors.primary,opacity:saving||!body.trim()?0.5:1}]}><Text style={styles.buttonText}>{saving?"Saving…":"Save changes"}</Text></Pressable></ScrollView></ScreenContainer>;
          }
          const styles=StyleSheet.create({content:{padding:20,gap:10},center:{flex:1,alignItems:"center",justifyContent:"center"},title:{fontSize:28,fontWeight:"900",marginBottom:12},label:{fontSize:10,fontWeight:"800",letterSpacing:1,marginTop:8},input:{borderWidth:1,borderRadius:14,padding:14,fontSize:15},body:{borderWidth:1,borderRadius:16,padding:14,minHeight:180,fontSize:15,lineHeight:22},button:{minHeight:52,borderRadius:16,alignItems:"center",justifyContent:"center",marginTop:14},buttonText:{color:"#10211D",fontSize:15,fontWeight:"900"}});
          EOF
      - name: Typecheck
        run: pnpm check
      - name: Commit verified repair
        run: |
          git config user.name 'lekka-repair-bot'
          git config user.email 'lekka-repair-bot@users.noreply.github.com'
          git add 'app/(tabs)/index.tsx' 'app/edit-post/[id].tsx'
          git diff --cached --quiet && exit 0
          git commit -m '[lekka-repair] complete post menu, editing and internal sharing'
          git push origin main
