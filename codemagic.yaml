workflows:
  lekka-android-apk:
    name: Lekka Android APK
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      groups:
        - expo
      vars:
        EXPO_NO_DOCTOR: "1"
        NODE_ENV: "production"
        CMAKE_BUILD_PARALLEL_LEVEL: "1"
    scripts:
      - name: Install pnpm
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
      - name: Install dependencies from locked native stack
        script: |
          pnpm install --frozen-lockfile
          test -x node_modules/.bin/expo
          node -e 'const p=require("./package.json"); const ok=p.dependencies.expo==="~54.0.29" && p.dependencies["react-native"]==="0.81.5" && p.dependencies["react-native-safe-area-context"]==="~5.6.2" && p.dependencies["react-native-worklets"]==="0.5.1"; if(!ok){console.error(p.dependencies); process.exit(1)}; console.log("Locked Expo 54 / RN 0.81.5 native stack verified")'
          pnpm exec expo --version
          node -e 'const p=require("./node_modules/expo/package.json"); if(!p.version.startsWith("54.")){console.error("Wrong Expo installed:",p.version); process.exit(1)}; console.log("Local Expo package:",p.version)'
      - name: Generate native Android project
        script: |
          rm -rf android
          pnpm exec expo prebuild --platform android --clean
      - name: Configure React Native architecture
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          text = p.read_text() if p.exists() else ""
          lines = [line for line in text.splitlines() if not line.startswith("newArchEnabled=")]
          lines.append("newArchEnabled=false")
          p.write_text("\n".join(lines) + "\n")
          print("Configured legacy React Native architecture to avoid the current C++ codegen linker failure")
          PY
          grep -n "^newArchEnabled=false$" android/gradle.properties
      - name: Verify Expo native configuration
        script: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("android/gradle.properties","utf8"); if(!/^newArchEnabled=false$/m.test(s)) process.exit(1); console.log("Legacy React Native architecture enabled")'
          node -e 'const p=require("./package.json"); if(p.dependencies.expo!=="~54.0.29") process.exit(1); if(p.dependencies["react-native"]!=="0.81.5") process.exit(1); if(p.dependencies["react-native-worklets"]!=="0.5.1") process.exit(1); if(p.dependencies["react-native-safe-area-context"]!=="~5.6.2") process.exit(1); console.log("Expo 54 + RN 0.81.5 native stack verified")'
      - name: Purge stale native CMake and Gradle state
        script: |
          ./android/gradlew --stop || true
          rm -rf android/.cxx android/app/.cxx android/build android/app/build
          find node_modules -type d \( -name .cxx -o -path '*/android/build' \) -prune -exec rm -rf {} + 2>/dev/null || true
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-clean"
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          echo "Native CMake, module Android build outputs and Gradle user cache purged"
      - name: Build installable Android debug APK
        script: |
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-clean"
          cd android
          ./gradlew clean --no-daemon --max-workers=1 --refresh-dependencies
          ./gradlew assembleDebug --no-daemon --max-workers=1 -PreactNativeArchitectures=arm64-v8a --rerun-tasks --refresh-dependencies --stacktrace --info 2>&1 | tee ../android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== NATIVE BUILD ERROR SUMMARY ====="
            grep -E -i 'error:|fatal error:|undefined reference|ld\.lld|clang:|ninja: error|FAILED' ../android-build.log | tail -n 100 || true
            echo "===== END ERROR SUMMARY ====="
            exit "$status"
          fi
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - wademeinie1@gmail.com
        notify:
          success: true
          failure: true
