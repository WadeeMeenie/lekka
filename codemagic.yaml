workflows:
  lekka-android-apk:
    name: Lekka Android APK
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      groups:
        - expo
      vars:
        EXPO_NO_DOCTOR: "1"
        NODE_ENV: "production"
        CMAKE_BUILD_PARALLEL_LEVEL: "1"
    scripts:
      - name: Install pnpm
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install dependencies
        script: |
          # package.json was deliberately aligned to Expo SDK 54's native stack.
          # Resolve the lockfile if dependency ranges changed; do not fail CI on
          # a stale lockfile while we stabilize the Android native build.
          pnpm install --no-frozen-lockfile
      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --non-interactive --clean
      - name: Enforce React Native New Architecture
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          text = p.read_text() if p.exists() else ""
          lines = [line for line in text.splitlines() if not line.startswith("newArchEnabled=")]
          lines.append("newArchEnabled=true")
          p.write_text("\n".join(lines) + "\n")
          print("Verified android/gradle.properties contains newArchEnabled=true")
          PY
          grep -n "^newArchEnabled=true$" android/gradle.properties
      - name: Verify Expo native configuration
        script: |
          node -e 'const fs=require("fs"); const p="android/gradle.properties"; const s=fs.readFileSync(p,"utf8"); if(!/^newArchEnabled=true$/m.test(s)) process.exit(1); console.log("New Architecture enabled")'
          node -e 'const p=require("./package.json"); if(p.dependencies["react-native-reanimated"]!=="~4.1.1") process.exit(1); console.log("Reanimated aligned to Expo SDK 54")'
      - name: Remove stale native CMake state
        script: |
          rm -rf android/.cxx android/app/.cxx
          find node_modules -type d -name .cxx -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Removed stale CMake/Ninja state"
      - name: Build installable Android debug APK
        script: |
          cd android
          ./gradlew clean --no-daemon --max-workers=1
          ./gradlew assembleDebug --no-daemon --max-workers=1 -PreactNativeArchitectures=arm64-v8a --rerun-tasks --stacktrace --info 2>&1 | tee ../android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== NATIVE BUILD ERROR SUMMARY ====="
            grep -E -i 'error:|fatal error:|undefined reference|ld\.lld|clang:|ninja: error|FAILED' ../android-build.log | tail -n 80 || true
            echo "===== END ERROR SUMMARY ====="
            exit "$status"
          fi
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - wademeinie1@gmail.com
        notify:
          success: true
          failure: true
