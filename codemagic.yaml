workflows:
  lekka-android-apk:
    name: Lekka Android APK
    max_build_duration: 60
    environment:
      node: 22
      java: 17
      groups:
        - expo
      vars:
        EXPO_NO_DOCTOR: "1"
        NODE_ENV: "production"
        CMAKE_BUILD_PARALLEL_LEVEL: "1"
    scripts:
      - name: Install pnpm
        script: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
      - name: Install dependencies from locked native stack
        script: |
          pnpm install --frozen-lockfile
          test -x node_modules/.bin/expo
          node -e 'const p=require("./package.json"); const ok=p.dependencies.expo==="~54.0.29" && p.dependencies["react-native"]==="0.81.5" && p.dependencies["react-native-reanimated"]==="~3.19.3" && p.dependencies["react-native-safe-area-context"]==="~5.6.2"; if(!ok){console.error("Unexpected native stack:", p.dependencies); process.exit(1)}; console.log("Locked Expo 54 / RN 0.81.5 / Reanimated 3 native stack verified")'
          pnpm exec expo --version
          node -e 'const p=require("./node_modules/expo/package.json"); if(!p.version.startsWith("54.")){console.error("Wrong Expo installed:",p.version); process.exit(1)}; console.log("Local Expo package:",p.version)'
      - name: Generate native Android project
        script: |
          rm -rf android
          pnpm exec expo prebuild --platform android --clean
      - name: Verify React Native architecture and native stack
        script: |
          node -e 'const fs=require("fs"); const s=fs.readFileSync("android/gradle.properties","utf8"); if(!/^newArchEnabled=false$/m.test(s)) { console.error("Legacy Architecture is not enabled in generated native project"); process.exit(1); } console.log("Legacy Architecture enabled for Expo 54 + Reanimated 3")'
          node -e 'const p=require("./package.json"); if(p.dependencies.expo!=="~54.0.29") process.exit(1); if(p.dependencies["react-native"]!=="0.81.5") process.exit(1); if(p.dependencies["react-native-reanimated"]!=="~3.19.3") process.exit(1); if(p.dependencies["react-native-safe-area-context"]!=="~5.6.2") process.exit(1); if(p.dependencies["react-native-worklets"]) { console.error("Unexpected react-native-worklets dependency"); process.exit(1); } console.log("Expo 54 + RN 0.81.5 + Reanimated 3 legacy native stack verified")'
      - name: Verify internal Android build variant
        script: |
          grep -n "internalDebug" android/app/build.gradle
          grep -n "Lekka internal-test variant" android/app/build.gradle
      - name: Purge stale native CMake and Gradle state
        script: |
          ./android/gradlew --stop || true
          rm -rf android/.cxx android/app/.cxx android/build android/app/build
          find node_modules -type d \( -name .cxx -o -path '*/android/build' \) -prune -exec rm -rf {} + 2>/dev/null || true
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-clean"
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          echo "Native CMake, module Android build outputs and Gradle user cache purged"
      - name: Build installable Android internal-test APK
        script: |
          export GRADLE_USER_HOME="$CM_BUILD_DIR/.gradle-clean"
          cd android
          ./gradlew clean --no-daemon --max-workers=1 --refresh-dependencies
          ./gradlew assembleInternalDebug --no-daemon --max-workers=1 -PreactNativeArchitectures=arm64-v8a --rerun-tasks --refresh-dependencies --stacktrace --info 2>&1 | tee ../android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== NATIVE BUILD ERROR SUMMARY ====="
            grep -E -i 'error:|fatal error:|undefined reference|undefined symbol|ld\.lld|clang:|ninja: error|FAILED' ../android-build.log | tail -n 150 || true
            echo "===== END ERROR SUMMARY ====="
            exit "$status"
          fi
          test -f app/build/outputs/apk/internalDebug/app-internal-debug.apk || (echo "Expected internal-test APK was not produced"; find app/build/outputs/apk -maxdepth 3 -type f -name '*.apk' -print; exit 1)
          echo "Installable Lekka internal-test APK produced successfully"
    artifacts:
      - android/app/build/outputs/apk/internalDebug/*.apk
    publishing:
      email:
        recipients:
          - wademeinie1@gmail.com
        notify:
          success: true
          failure: true
